services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Dev mode: serve from root "/" instead of the GitHub Pages basePath "/yarin"
      - NEXT_PUBLIC_BASE_PATH=
      # Needed by next.config.mjs allowedDevOrigins to accept the preview origin
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    command:
      [
        "sh",
        "-ec",
        "npm ci && exec npx next dev --hostname 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
